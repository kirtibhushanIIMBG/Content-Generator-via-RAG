<rect x="40" y="474" width="880" height="50" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="62" y="505" class="cap k17 rm-hide" opacity="0" data-fit="40,920">A person fills in the form: topic, optional link, word limit, format, and whether to use current news.</text>
<text x="62" y="505" class="cap k18 rm-hide" opacity="0" data-fit="40,920">n8n asks the API whether the DPDP texts cover the topic. If not, the user decides what happens next.</text>
<text x="62" y="505" class="cap k19 rm-hide" opacity="0" data-fit="40,920">If asked, Claude turns trending news (NewsData, NewsAPI) or the linked article into content ideas.</text>
<text x="62" y="505" class="cap k20 rm-hide" opacity="0" data-fit="40,920">The user picks the idea to write about. Without news or a link, the topic goes straight to drafting.</text>
<text x="62" y="505" class="cap k21 rm-hide" opacity="0" data-fit="40,920">The API drafts it once per chosen format, with the same grounding and cite_check as the app.</text>
<text x="62" y="505" class="cap k22 rm-hide" opacity="0" data-fit="40,920">Each draft becomes a Google Doc in Drive, where a person reviews it before anything is published.</text>
<text x="62" y="505" class="cap k23 rm-hide" opacity="0" data-fit="40,920">Each Doc shows the machine’s verdict and numbered citations, and still needs a person’s sign-off.</text>
<text x="62" y="505" class="cap rm-show" opacity="0" data-fit="40,920">Form → relevance check → ideas → pick → generate → Google Docs</text>
<rect x="40" y="540" width="880" height="4" rx="2" fill="#30363d"/><g class="k25"><rect x="40" y="540" width="880" height="4" rx="2" fill="#3987e5" class="tb k24" style="transform-origin: 0 50%"/></g>
</svg>