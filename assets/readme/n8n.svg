<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" width="960" height="568" role="img" aria-labelledby="t d">
<title id="t">The n8n automation</title>
<desc id="d">Animated flow of the n8n workflow in six steps. 1 Form: topic, optional link, word limit, format and whether to use current news. 2 Relevance check through the API; off-topic subjects let the user tie them to DPDP, go general, or stop. 3 Optional ideas: Claude reads trending news or the reference article. 4 The user picks an idea. 5 The API generates once per chosen format. 6 Each draft is saved as a Google Doc in Drive for human review: blog, LinkedIn long, LinkedIn short, newsletter.</desc>
